name: unitastic_mobile
description: A cross-platform mobile application for Unitastic.
publish_to: 'none'

version: 0.3.0+5

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_launcher_icons: ^0.14.4
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.8
  package_info_plus: ^10.2.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  firebase_analytics: ^12.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/
    - assets/fonts/
  uses-material-design: true

flutter_launcher_icons:
  android: true
  adaptive_icon_background: "assets/images/adaptive_bg.png"
  adaptive_icon_foreground: "assets/images/adaptive_fg.png"
  ios: true
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#00adb5"
  image: "assets/images/adaptive_fg.png"
  color_dark: "#00adb5"
  image_dark: "assets/images/adaptive_fg.png"

  android_12:
    image: "assets/images/adaptive_fg.png"
    icon_background_color: "#00adb5"
    image_dark: "assets/images/adaptive_fg.png"
    icon_background_color_dark: "#00adb5"